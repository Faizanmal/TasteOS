[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tasteos-api"
version = "0.1.0"
description = "TasteOS — Cultural Intelligence Layer for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "python-multipart>=0.0.12",
  "slowapi>=0.1.9",
  "aiosqlite>=0.20.0",
  "greenlet>=3.1.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[project.scripts]
tasteos = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: live Qloo network tests (require QLOO_API_KEY)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # long explanatory strings are fine in this codebase
  "B008",  # FastAPI Depends()/Query() defaults are idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Env vars must be set before importing app modules that read settings at import time.
"**/tests/conftest.py" = ["E402"]

[tool.uvicorn]
factory = false
