# TasteOS — Netlify Configuration
# Framework adapter for Next.js App Router (OpenNext / Netlify Next.js runtime)

[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"
  environment = { NEXT_PUBLIC_API_BASE_URL = "https://tasteos-api-845068580921.us-central1.run.app" }

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Header security policies
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

