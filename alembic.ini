# Minimal Alembic stub — TasteOS currently uses SQLAlchemy create_all on startup
# for hackathon velocity. Point script_location at apps/api/alembic when enabling migrations.

[alembic]
script_location = apps/api/alembic
sqlalchemy.url = postgresql+psycopg://tasteos:tasteos@localhost:5432/tasteos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
