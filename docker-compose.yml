# TasteOS — Production Docker Compose (FastAPI + PostgreSQL)
# Usage: docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasteos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasteos_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-tasteos}
    volumes:
      - tasteos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasteos} -d ${POSTGRES_DB:-tasteos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      TASTEOS_MODE: ${TASTEOS_MODE:-demo}
      QLOO_BASE_URL: ${QLOO_BASE_URL:-https://hackathon.api.qloo.com}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tasteos}:${POSTGRES_PASSWORD:-tasteos_secure_password}@db:5432/${POSTGRES_DB:-tasteos}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  tasteos_pg_data:
